# This workflow updates the Academy every 30 minutes (off the top of the
# hour, when GitHub delays and drops many scheduled runs): scrape videos,
# classify tournaments and videos, export the Academy data, rebuild the
# website and push everything to master. The tournaments of all sources are
# put together (one per real event, each deck counted once) before the
# export: the Academy data and the website read only the decks that counts.
# A run that takes longer than 30 minutes makes the next one wait: the
# concurrency group below keeps at most one run pending behind it.
#
# MTGGoldfish tournaments are NOT scraped here: MTGGoldfish answers 403 to
# GitHub-hosted runners. razor scrapes them (cron, ~/myr-scraper/scrape.sh)
# and pushes the decks to master, where the next run classifies them. The
# metagame chart is built from the classified decks, in the same run.

name: myr-academy-update

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Never run two updates at once: they would push conflicting commits and
# could both spend the single-use Moxfield refresh token.
concurrency:
  group: myr-academy-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      MTGGOLDFISH_PAUPERFORMANCE_PASSWORD: ${{ secrets.MTGGOLDFISH_PAUPERFORMANCE_PASSWORD }}
      MTGGOLDFISH_PAUPERFORMANCE_USERNAME: ${{ secrets.MTGGOLDFISH_PAUPERFORMANCE_USERNAME }}
      TWITCH_APP_CLIENT_ID: ${{ secrets.TWITCH_APP_CLIENT_ID }}
      TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_APP_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Myr reads ACADEMY_PATH at import time: every step needs it.
      ACADEMY_PATH: ${{ github.workspace }}/academy
      # The installed Myr has no git history: it dates the families and
      # archetypes of the Newspauper with the history of this full clone.
      MYR_PATH: ${{ github.workspace }}/myr
    steps:

    # pauperformance-bot is private: it is cloned with a read-only deploy key
    # (public key on pauperformance-bot, private key in MYR_DEPLOY_KEY).
    # Full history (fetch-depth 0): see MYR_PATH.
    - name: Clone Myr repository
      uses: actions/checkout@v4
      with:
        repository: 'Pauperformance/pauperformance-bot'
        ref: 'master'
        path: './myr'
        fetch-depth: 0
        ssh-key: ${{ secrets.MYR_DEPLOY_KEY }}
        persist-credentials: false

    - name: Clone Academy repository
      uses: actions/checkout@v4
      with:
        ref: 'master'
        path: './academy'

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Myr
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install ./myr

    # The tasks below run from the workspace root, so that Python imports
    # the installed package rather than the source tree in ./myr.
    # Sideboard guides come from a Google Sheet and are read by
    # "academy update" below. MTGGoldfish is scraped by razor (see top).
    - name: Update sideboard guides (sync scraper)
      run: |
        source venv/bin/activate
        python -m pauperformance_bot.task.sync_scraper sideboards

    - name: Scrape videos (async scraper)
      run: |
        source venv/bin/activate
        python -m pauperformance_bot.task.async_scraper

    - name: Classify tournaments
      run: |
        source venv/bin/activate
        myr silver classify-tournaments

    # Puts the tournaments of all sources together, into
    # assets/data/tournament/reconciled. It reads the stored tournaments, not
    # the classification: it and "Classify tournaments" are independent and
    # can run in either order, but both must precede "Update Academy".
    - name: Reconcile tournaments
      run: |
        source venv/bin/activate
        myr academy reconcile

    - name: Classify videos
      run: |
        source venv/bin/activate
        myr silver classify-videos

    - name: Update Academy
      run: |
        source venv/bin/activate
        myr academy update

    - name: Push changes
      id: push
      working-directory: academy
      run: |
        git config --local user.email "ShadowTemplate@users.noreply.github.com"
        git config --local user.name "Myr"
        git add -A
        git status --short
        if git diff --cached --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Myr update: $(date -u +'%Y-%m-%d, %H:%M:%S')"
          # master may have moved meanwhile. On conflicts keep Myr's side
          # (in a rebase, "theirs" is the commit being replayed).
          git pull --rebase -X theirs
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    outputs:
      changed: ${{ steps.push.outputs.changed }}

  # The website (docs/, not tracked by git) is built and deployed from the
  # master Myr just pushed. This push does not trigger deploy-site by itself.
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_site.yml

# This workflow updates the Academy every 2 hours (at minute 17, off the
# top of the hour, when GitHub delays and drops many scheduled runs):
# scrape tournaments and videos, classify them, export the Academy data,
# rebuild the website and push everything to master.

name: myr-academy-update

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

# Never run two updates at once: they would push conflicting commits and
# could both spend the single-use Moxfield refresh token.
concurrency:
  group: myr-academy-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      MTGGOLDFISH_PAUPERFORMANCE_PASSWORD: ${{ secrets.MTGGOLDFISH_PAUPERFORMANCE_PASSWORD }}
      MTGGOLDFISH_PAUPERFORMANCE_USERNAME: ${{ secrets.MTGGOLDFISH_PAUPERFORMANCE_USERNAME }}
      TWITCH_APP_CLIENT_ID: ${{ secrets.TWITCH_APP_CLIENT_ID }}
      TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_APP_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Myr reads ACADEMY_PATH at import time: every step needs it.
      ACADEMY_PATH: ${{ github.workspace }}/academy
      # The installed Myr has no git history: it dates the families and
      # archetypes of the Newspauper with the history of this full clone.
      MYR_PATH: ${{ github.workspace }}/myr
    steps:

    # pauperformance-bot is private: it is cloned with a read-only deploy key
    # (public key on pauperformance-bot, private key in MYR_DEPLOY_KEY).
    # Full history (fetch-depth 0): see MYR_PATH.
    - name: Clone Myr repository
      uses: actions/checkout@v4
      with:
        repository: 'Pauperformance/pauperformance-bot'
        ref: 'master'
        path: './myr'
        fetch-depth: 0
        ssh-key: ${{ secrets.MYR_DEPLOY_KEY }}
        persist-credentials: false

    - name: Clone Academy repository
      uses: actions/checkout@v4
      with:
        ref: 'master'
        path: './academy'

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Myr
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install ./myr

    # The tasks below run from the workspace root, so that Python imports
    # the installed package rather than the source tree in ./myr.
    - name: Scrape tournaments (sync scraper)
      run: |
        source venv/bin/activate
        python -m pauperformance_bot.task.sync_scraper

    - name: Scrape videos (async scraper)
      run: |
        source venv/bin/activate
        python -m pauperformance_bot.task.async_scraper

    - name: Classify tournaments
      run: |
        source venv/bin/activate
        myr silver classify-tournaments

    - name: Classify videos
      run: |
        source venv/bin/activate
        myr silver classify-videos

    - name: Update Academy
      run: |
        source venv/bin/activate
        myr academy update

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: academy/package-lock.json

    # The React site serves docs/, generated from the assets Myr just updated.
    - name: Build website
      working-directory: academy
      run: |
        npm ci
        npm run build

    - name: Push changes
      working-directory: academy
      run: |
        git config --local user.email "ShadowTemplate@users.noreply.github.com"
        git config --local user.name "Myr"
        git add -A
        git status --short
        if git diff --cached --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "Myr update: $(date -u +'%Y-%m-%d, %H:%M:%S')"
          # master may have moved meanwhile (e.g. a push rebuilt by
          # build-site). On conflicts keep Myr's side (in a rebase, "theirs"
          # is the commit being replayed), then rebuild docs/ from the
          # rebased sources, since this push does not trigger build-site.
          base=$(git rev-parse HEAD~1)
          git pull --rebase -X theirs
          if [ "$(git rev-parse HEAD~1)" != "$base" ]; then
            npm run build
            git add -A docs
            git diff --cached --quiet || git commit --amend --no-edit
          fi
          git push
        fi
